<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Note Quest">
<meta name="theme-color" content="#FFF4F8">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Princess Note Quest</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one phone-width column; each screen is a stack of soft white cards on a blush or lavender ground. Single light "storybook" look on purpose. */
:root{
  color-scheme: light;
  --blush:#FFF4F8; --lilac:#F6F0FF; --card:#FFFFFF;
  --ink:#4A1D4F; --ink-soft:#6B4470;
  --rose:#C2306E; --rose-deep:#8F1F50; --rose-tint:#F9D3E2; --rose-line:#F3C9DA;
  --violet:#7A3E9D; --violet-deep:#55276F; --lav:#E9DDFB; --lav-line:#D9C6F5;
  --gold:#F2B630; --gold-deep:#B9831A;
  --right:#2B6CB0; --right-deep:#1D4E80; --right-tint:#DCEBFA;
  --wrong:#B8521A; --wrong-deep:#7E3810; --wrong-tint:#FCE6D8;
  --locked:#F1E4EB; --locked-ink:#7E6480;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--blush);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
body.lilac{background:var(--lilac)}
button{font:inherit;color:inherit}
.app{max-width:440px;margin:0 auto;min-height:100%;box-sizing:border-box;padding-inline:16px;padding-block:18px 24px;display:flex;flex-direction:column;gap:16px}
.app>*{min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{font-family:var(--display);font-weight:600;font-size:22px;margin:0;text-align:center;flex:1;text-wrap:balance}
.icon-btn{border:0;cursor:pointer;width:44px;height:44px;flex-shrink:0;border-radius:22px;background:var(--card);display:flex;align-items:center;justify-content:center}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:20px;padding:8px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.hearts{display:flex;gap:3px}
.card{background:var(--card);border-radius:28px;box-shadow:0 6px 0 var(--rose-line);padding:16px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.lilac .card{box-shadow:0 6px 0 var(--lav-line)}
.staff{width:100%;max-width:360px}
.staff svg{display:block}
.prompt{font-family:var(--display);font-weight:600;font-size:19px;text-align:center}
.prompt.small{font-family:var(--body);font-size:15px;font-weight:700;color:var(--ink-soft)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{border:0;cursor:pointer;padding:9px 14px;border-radius:16px;background:var(--card);font-weight:800;font-size:14px;min-height:40px}
.chip.on{background:var(--violet);color:#fff}
.chip.tag{background:var(--lav);cursor:default;min-height:0;padding:6px 12px;font-size:13px}

/* answer buttons */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opts.seq{grid-template-columns:minmax(0,1fr)}
.opt{border:0;cursor:pointer;min-height:76px;border-radius:22px;background:var(--card);box-shadow:0 5px 0 var(--rose-line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:8px;transition:transform .12s}
.lilac .opt{box-shadow:0 5px 0 var(--lav-line)}
.opt:active{transform:translateY(3px)}
.opt .main{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.1;display:flex;align-items:center;gap:8px}
.opts.seq .opt{min-height:62px}
.opts.seq .opt .main{font-size:26px;letter-spacing:1px}
.opts.seq4 .opt .main{font-size:23px}
.opt .sub{font-size:13px;font-weight:800;color:var(--ink-soft);letter-spacing:1px}
.opt.right{background:var(--right);box-shadow:0 5px 0 var(--right-deep);color:#fff;animation:pop .35s}
.opt.right .sub{color:#E3EEFA}
.opt.wrong{background:var(--wrong);box-shadow:0 5px 0 var(--wrong-deep);color:#fff}
.opt.wrong .sub{color:#FBE4D6}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}

.feedback{border-radius:20px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.feedback.ok{background:var(--right-tint);color:var(--right-deep)}
.feedback.no{background:var(--wrong-tint);color:var(--wrong-deep)}
.feedback.hint{background:var(--lav);color:var(--ink)}
.feedback b{display:block;font-size:16px;font-weight:800}
.feedback span{font-size:14px;line-height:1.4}

.btn-row{display:flex;gap:12px;margin-top:auto}
.btn{border:0;cursor:pointer;flex:1;min-height:54px;border-radius:20px;background:var(--card);font-weight:800;font-size:16px;color:var(--violet);display:flex;align-items:center;justify-content:center;gap:8px}
.btn.wide{flex:1.4}
.btn.violet{background:var(--violet);color:#fff;box-shadow:0 5px 0 var(--violet-deep)}
.btn.rose{background:var(--rose);color:#fff;box-shadow:0 5px 0 var(--rose-deep)}
.btn.ghost{color:var(--rose-deep)}

/* home */
.hello{display:flex;align-items:center;gap:10px;font-weight:800;min-width:0}
.hello span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:44px;height:44px;border-radius:22px;background:var(--lav);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand{text-align:center;display:flex;flex-direction:column;gap:4px}
.brand h1{font-family:var(--display);font-weight:700;font-size:44px;color:var(--rose);line-height:1;margin:0}
.brand p{margin:0;color:var(--ink-soft)}
.menu{border:0;cursor:pointer;text-align:left;background:var(--card);border-radius:24px;padding:14px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 0 var(--lav-line)}
.menu .ico{width:52px;height:52px;border-radius:16px;background:var(--lav);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.menu .txt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.menu .name{font-family:var(--display);font-weight:600;font-size:21px}
.menu .desc{font-size:14px;color:var(--ink-soft)}
.menu.rose{background:var(--rose);box-shadow:0 6px 0 var(--rose-deep);color:#fff}
.menu.rose .ico{background:#fff}
.menu.rose .desc{color:#FFE6EF}
.menu.pink .ico{background:var(--rose-tint)}
.bottom{display:flex;align-items:center;gap:10px;margin-top:auto}
.seg{display:flex;background:var(--card);border-radius:22px;padding:4px;flex:1}
.seg button{border:0;cursor:pointer;flex:1;min-height:42px;border-radius:18px;background:transparent;font-weight:800;font-size:14px}
.seg button.on{background:var(--ink);color:#fff}
.set-card .seg{background:var(--lilac)}
.set-card .seg button.on{background:var(--violet)}

/* timer */
.timebox{display:flex;flex-direction:column;gap:8px}
.timebox .row{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
.timebox .row .secs{color:var(--rose-deep);font-variant-numeric:tabular-nums}
.bar{height:14px;border-radius:7px;background:#F3D6E2;overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px;background:var(--rose);width:100%}
.bar.low i{background:var(--wrong)}
.scorebar{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:20px;padding:12px 18px;margin-top:auto}
.scorebar small{display:block;font-size:13px;color:var(--ink-soft)}
.scorebar strong{font-family:var(--display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}

/* levels */
.note{font-size:14px;color:var(--ink-soft);margin:0}
.tower{font-weight:800;font-size:13px;letter-spacing:1.2px;color:var(--rose-deep);text-transform:uppercase;margin-bottom:-6px}
.lvls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lvl{border:0;cursor:pointer;background:var(--card);border-radius:20px;padding:10px 0;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 4px 0 var(--rose-line)}
.lvl .num{font-family:var(--display);font-weight:700;font-size:28px;line-height:1}
.lvl .st{display:flex;gap:1px}
.lvl.locked{background:var(--locked);color:var(--locked-ink);box-shadow:none;cursor:default}
.lvl.sel{outline:3px solid var(--gold);outline-offset:3px}
.lvl.next{background:var(--rose);color:#fff;box-shadow:0 4px 0 var(--rose-deep)}
.detail{background:var(--card);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:6px;margin-top:auto}
.detail h2{margin:0;font-size:16px;font-weight:800}
.detail p{margin:0;font-size:14px;color:var(--ink-soft)}
.detail .btn{margin-top:8px}

/* results */
.res{align-items:center;text-align:center}
.res h1{font-family:var(--display);font-weight:700;font-size:34px;color:var(--rose);margin:0;line-height:1.1;text-wrap:balance}
.bigstars{display:flex;gap:8px;align-items:flex-end;justify-content:center}
.bigstars svg{animation:twinkle .6s backwards}
.bigstars svg:nth-child(2){animation-delay:.15s}
.bigstars svg:nth-child(3){animation-delay:.3s}
@keyframes twinkle{0%{transform:scale(.3) rotate(-30deg);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.stats{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats div{background:var(--card);border-radius:18px;padding:12px 0}
.stats strong{display:block;font-family:var(--display);font-weight:700;font-size:23px;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--ink-soft)}
.panel{width:100%;box-sizing:border-box;background:var(--lav);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;text-align:left}
.panel b{font-size:15px}
.tricky{display:flex;gap:8px;flex-wrap:wrap}
.tricky span{padding:8px 14px;border-radius:14px;background:var(--card);font-family:var(--display);font-weight:700;font-size:18px}
.banner{width:100%;box-sizing:border-box;background:var(--rose);color:#fff;border-radius:20px;padding:14px 16px;font-weight:800}
.banner.soft{background:var(--rose-tint);color:var(--rose-deep)}

/* scale */
.scale-wrap{position:relative;width:100%;max-width:360px;cursor:pointer}
.labels{position:relative;height:56px;width:100%;max-width:360px}
.labels button{position:absolute;top:0;transform:translateX(-50%);border:0;background:transparent;cursor:pointer;width:38px;padding:4px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center}
.labels button .s{font-family:var(--display);font-weight:700;font-size:16px}
.labels button .l{font-size:12px;font-weight:800;color:var(--ink-soft)}
.labels button.acc .s,.labels button.acc .l{color:var(--rose)}
.labels button.on{background:var(--rose-tint)}
.keyinfo{background:var(--card);border-radius:20px;padding:14px 16px;display:flex;gap:12px;align-items:center;font-size:14px;line-height:1.4}
.keyinfo .sym{width:40px;height:40px;border-radius:20px;background:var(--rose-tint);color:var(--rose);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:24px;font-weight:700}

/* lessons */
.dots{display:flex;gap:6px;justify-content:center;margin-top:-6px}
.dots i{width:10px;height:10px;border-radius:5px;background:var(--lav)}
.dots i.on{background:var(--violet)}
.dots i.now{background:var(--rose);width:22px}
.lesson-text{background:var(--card);border-radius:22px;padding:18px;font-size:18px;line-height:1.5}
.lesson-text b{color:var(--rose-deep)}
.lesson-num{font-family:var(--display);font-weight:700;font-size:24px;color:var(--violet)}
.menu.rose .lesson-num{color:var(--rose)}
.lesson-num.done{background:var(--right-tint)!important}

/* settings */
.set-card{background:var(--card);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.set-card h2{margin:0;font-size:15px;font-weight:800}
.set-card p{margin:0;font-size:13px;color:var(--ink-soft)}
.set-card .chips{justify-content:flex-start}
.set-card .chip{background:var(--lilac)}
.set-card .chip.on{background:var(--ink);color:#fff}
.stepper{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stepper>span{font-size:14px;color:var(--ink-soft)}
.stepper div{display:flex;align-items:center;gap:8px}
.stepper button{border:0;cursor:pointer;width:44px;height:44px;border-radius:22px;background:var(--lilac);font-size:22px;font-weight:800}
.stepper button[disabled]{opacity:.4;cursor:default}
.stepper output{font-family:var(--display);font-weight:700;font-size:18px;min-width:92px;text-align:center}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch{border:0;cursor:pointer;width:58px;height:34px;border-radius:17px;background:var(--lav);position:relative;flex-shrink:0}
.switch::after{content:"";position:absolute;left:4px;top:4px;width:26px;height:26px;border-radius:13px;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--rose)}
.switch[aria-checked="true"]::after{left:28px}
.text-in{font:inherit;font-weight:700;border:2px solid var(--lav);border-radius:14px;padding:10px 12px;color:var(--ink);background:var(--card);min-height:24px}
.text-in:focus{outline:none;border-color:var(--violet)}
.vf-err{color:var(--wrong-deep);font-weight:700;text-align:center;padding:24px 8px;margin:0}

/* piano palace */
body.keys .app{max-width:none;height:100%;padding-block:8px 10px;gap:8px}
.kv-top{display:flex;gap:10px;flex:1;min-height:0}
.kv-staff{flex:1.3;min-width:0;background:var(--card);border-radius:22px;padding:6px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--lav-line)}
.kv-staff .staff{height:100%;width:100%;max-width:none;display:flex;justify-content:center;align-items:center}
.kv-staff svg{width:auto!important;height:100%!important;max-width:100%;max-height:100%}
.kv-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;justify-content:flex-start;overflow-y:auto;min-height:0}
.kv-top{overflow:hidden}
.kv-row .btn.rose{flex:.8}
.kv-msg{background:var(--card);border-radius:18px;padding:10px 12px;font-size:15px;line-height:1.35}
.kv-msg b{display:block;font-size:16px}
.kv-msg.ok{background:var(--right-tint);color:var(--right-deep)}
.kv-msg.no{background:var(--wrong-tint);color:var(--wrong-deep)}
.kv-row{display:flex;gap:8px}
.kv-row .btn{min-height:46px;font-size:15px}
.kv-tog{display:flex;gap:6px;flex-wrap:wrap}
.kv-tog .chip{min-height:36px;padding:6px 12px;font-size:13px}
.kv-head{display:flex;align-items:center;gap:10px}
.kv-head h1{margin:0;font-family:var(--display);font-weight:600;font-size:20px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv-head .chips{flex-wrap:nowrap;gap:6px}
.kv-head .chip{min-height:38px;padding:6px 12px;font-size:13px}
.piano-wrap{overflow-x:auto;flex:none;border-radius:14px;background:var(--ink);padding:6px 4px 4px}
.piano{position:relative;display:flex;height:clamp(110px,36vh,190px);min-width:100%}
.wk{flex:1 1 0;min-width:0;border:0;margin:0 1px;background:#fff;border-radius:0 0 10px 10px;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 0 8px;font-weight:800;font-size:12px;color:var(--ink-soft);box-shadow:inset 0 -6px 0 #EFE6FB;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.wk .mc{width:9px;height:9px;border-radius:5px;background:var(--rose);margin-bottom:5px}
.bk{position:absolute;top:0;height:60%;border:0;background:#2A0F2E;border-radius:0 0 8px 8px;cursor:pointer;z-index:2;box-shadow:inset 0 -6px 0 #4A1D4F;touch-action:manipulation;padding:0}
.wk.hit-ok,.bk.hit-ok{background:var(--right)!important;color:#fff;box-shadow:none}
.wk.hit-no,.bk.hit-no{background:var(--wrong)!important;color:#fff;box-shadow:none}
.wk.hint,.bk.hint{background:var(--gold)!important;color:var(--ink)}
.wk.pressed,.bk.pressed{filter:brightness(.9)}
.rotate-tip{display:none;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:8px 12px;font-size:14px;font-weight:700}
@media (orientation:landscape) and (max-height:540px){
  .kv-msg{padding:8px 12px;font-size:14px}
  .kv-msg b{font-size:15px}
  .kv-msg .more{display:none}
  .kv-row .btn{min-height:40px}
  .kv-head .icon-btn{width:40px;height:40px}
  .kv-head h1{font-size:18px}
  .piano{height:clamp(96px,34vh,150px)}
}
@media (orientation:portrait){
  .rotate-tip{display:flex}
  .kv-top{flex-direction:column}
  .kv-staff{min-height:190px;flex:none}
  .piano{height:190px;min-width:calc(var(--nw) * 42px)}
  .kv-head{flex-wrap:wrap}
  .kv-head .chips{width:100%;flex-wrap:wrap;justify-content:center}
}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<main class="app" id="app" aria-live="polite"></main>

<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
<script>
(function(){
const VF = window.Vex && window.Vex.Flow;
const INK = '#4A1D4F', ROSE = '#C2306E', RIGHT = '#2B6CB0';
const LET = ['C','D','E','F','G','A','B'];
const SOL = ['Do','Re','Mi','Fa','So','La','Si'];
const SEMI = [0,2,4,5,7,9,11];
const KEYS = {
  C:{label:'C major', short:'', acc:{}, info:'No sharps or flats by the clef, so every note is plain.', sym:'♮'},
  F:{label:'F major', short:'1♭', acc:{6:-1}, info:'The ♭ by the clef sits on the Si line, so every Si is Si♭ (B♭).', sym:'♭'},
  G:{label:'G major', short:'1♯', acc:{3:1}, info:'The ♯ by the clef sits on the Fa line, so every Fa is Fa♯ (F♯).', sym:'♯'},
  D:{label:'D major', short:'2♯', acc:{3:1,0:1}, info:'Two ♯ by the clef: every Fa is Fa♯ and every Do is Do♯.', sym:'♯'}
};
const SCALE_START = {C:28, F:31, G:32, D:29};
const LEVELS = [
  {n:1,time:10,rounds:12},{n:1,time:7,rounds:15},{n:1,time:5,rounds:15},
  {n:2,time:12,rounds:12},{n:2,time:9,rounds:12},{n:2,time:7,rounds:12},
  {n:4,time:16,rounds:10},{n:4,time:13,rounds:10},{n:4,time:10,rounds:10}
];
const TOWERS = [['Tower 1 · One note',0],['Tower 2 · Two notes',3],['Tower 3 · Four notes',6]];
const NOTE_WORD = {1:'One note',2:'Two notes',4:'Four notes'};
const PRESETS = {
  mid:{label:'Around middle C', treble:[28,35], bass:[22,28], grand:[24,33]},
  inside:{label:'Inside the staff', treble:[30,38], bass:[18,26], grand:[18,38]},
  ledger:{label:'+ Ledger lines', treble:[26,42], bass:[14,30], grand:[14,42]}
};

/* ---------- state ---------- */
const S = {
  screen:'home',
  settings:{names:'solfege', staff:'treble', low:17, high:40, key:'F', sound:true, name:'', keyNames:true, exact:true},
  progress:{best:[0,0,0,0,0,0,0,0,0], practiced:0, lessons:[], keysBest:{}},
  savedAt:0, sel:null, scaleKey:null, scaleSel:null
};
let P = {n:1, streak:0}, G = null, R = null, lastQ = '';

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const rint = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const liOf = step => ((step % 7) + 7) % 7;
const octOf = step => Math.floor(step / 7);
function accSym(li, key){ const a = KEYS[key || S.settings.key].acc[li] || 0; return a < 0 ? '♭' : a > 0 ? '♯' : ''; }
function names(li, key){ const s = accSym(li, key); return {sol: SOL[li] + s, let: LET[li] + s}; }
function label(lis, key){
  const parts = lis.map(li => names(li, key)), m = S.settings.names;
  const sol = parts.map(p => p.sol).join(' · '), let_ = parts.map(p => p.let).join(' · ');

/* ---------- sound ---------- */
let AC = null;
function audio(){
  if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume().catch(()=>{});
  return AC;
}
function tone(f, delay, dur, vol){
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  g.connect(a.destination);
  [['triangle',1,1],['sine',2,0.3],['sine',3,0.08]].forEach(([type,m,v]) => {
    const o = a.createOscillator(); o.type = type; o.frequency.value = f * m;
    const og = a.createGain(); og.gain.value = v;
    o.connect(og); og.connect(g); o.start(t); o.stop(t + dur + 0.05);
  });
}
function playSteps(steps, key, gap){
  if (!S.settings.sound) return;
  steps.forEach((s, i) => tone(freq(s, key || S.settings.key), i * (gap || 0.38), 1.2, 0.22));
}

/* ---------- saving ---------- */
const LS = 'note-quest-v1';
let dbDoc = null, saveTimer = null;
function merge(d){
  if (!d || typeof d !== 'object') return;
  if (d.settings && typeof d.settings === 'object'){
    const s = d.settings, o = S.settings;
    if (['solfege','letter','both'].includes(s.names)) o.names = s.names;
    if (['treble','bass','grand'].includes(s.staff)) o.staff = s.staff;
    if (Number.isInteger(s.low) && Number.isInteger(s.high) && s.low >= 14 && s.high <= 42 && s.high - s.low >= 3){ o.low = s.low; o.high = s.high; }
    if (KEYS[s.key]) o.key = s.key;
    if (typeof s.sound === 'boolean') o.sound = s.sound;
    if (typeof s.name === 'string') o.name = s.name.slice(0, 16);
    if (typeof s.keyNames === 'boolean') o.keyNames = s.keyNames;
    if (typeof s.exact === 'boolean') o.exact = s.exact;
  }
  if (d.progress && typeof d.progress === 'object'){
    const b = d.progress.best;
    if (Array.isArray(b) && b.length === 9) S.progress.best = b.map(v => clamp(parseInt(v) || 0, 0, 3));
    if (d.progress.keysBest && typeof d.progress.keysBest === 'object'){ const kb = {}; ['1','2','4'].forEach(n => { const v = d.progress.keysBest[n]; if (Number.isFinite(v) && v > 0) kb[n] = v; }); S.progress.keysBest = kb; }
    if (Number.isFinite(d.progress.practiced)) S.progress.practiced = Math.max(0, d.progress.practiced | 0);
    if (Array.isArray(d.progress.lessons)) S.progress.lessons = d.progress.lessons.filter(v => Number.isInteger(v) && v >= 0 && v < 10);
    else if (S.settings.staff !== 'treble') S.settings.staff = 'treble'; /* saved before lessons existed: start on the top staff */
  }
  if (Number.isFinite(d.savedAt)) S.savedAt = d.savedAt;
}
function snapshot(){ return {settings:{...S.settings}, progress:{best:S.progress.best.slice(), practiced:S.progress.practiced, lessons:S.progress.lessons.slice(), keysBest:{...S.progress.keysBest}}, savedAt:S.savedAt}; }
function save(){
  S.savedAt = Date.now();
  const data = snapshot();
  try { localStorage.setItem(LS, JSON.stringify(data)); } catch(e){}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { if (dbDoc) dbDoc.set(data).catch(()=>{}); }, 800);
}
try { merge(JSON.parse(localStorage.getItem(LS) || 'null')); } catch(e){}
async function connect(){
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    dbDoc = db.doc('data/users/' + uid + '/progress');
    const snap = await dbDoc.get();
    const remote = snap.exists ? snap.data() : null;
    if (remote && (remote.savedAt || 0) > (S.savedAt || 0)){
      merge(remote);
      try { localStorage.setItem(LS, JSON.stringify(snapshot())); } catch(e){}
      if (['home','levels','settings','scale'].includes(S.screen)) render();
    } else if (S.savedAt){
      dbDoc.set(snapshot()).catch(()=>{});
    }
  } catch(e){ /* stay on this phone only */ }
}

/* ---------- questions ---------- */
function pools(){
  const {staff, low, high} = S.settings, out = [];
  if (staff === 'treble'){
    let lo = Math.max(low, 26), hi = Math.min(high, 42);
    if (hi - lo < 3){ lo = 30; hi = 38; }
    out.push({staff:'treble', lo, hi});
  } else if (staff === 'bass'){
    let lo = Math.max(low, 14), hi = Math.min(high, 30);
    if (hi - lo < 3){ lo = 18; hi = 26; }
    out.push({staff:'bass', lo, hi});
  } else {
    const tl = Math.max(low, 28), th = Math.min(high, 42), bl = Math.max(low, 14), bh = Math.min(high, 27);
    if (th - tl >= 2) out.push({staff:'treble', lo:tl, hi:th});
    if (bh - bl >= 2) out.push({staff:'bass', lo:bl, hi:bh});
    if (!out.length) out.push({staff:'treble', lo:30, hi:38});
  }
  return out;
}
function makeQuestion(n){
  const ps = pools();
  const total = ps.reduce((s, p) => s + p.hi - p.lo + 1, 0);
  let r = Math.random() * total, pool = ps[0];
  for (const p of ps){ r -= p.hi - p.lo + 1; if (r < 0){ pool = p; break; } }
  let steps, sig, tries = 0;
  do {
    steps = []; let prev = null;
    for (let i = 0; i < n; i++){
      let s, t = 0;
      do { s = prev === null ? rint(pool.lo, pool.hi) : clamp(prev + rint(-4, 4), pool.lo, pool.hi); t++; }
      while (s === prev && t < 20);
      steps.push(s); prev = s;
    }
    sig = steps.join(',');
    tries++;
  } while (sig === lastQ && tries < 20);
  lastQ = sig;
  const correct = steps.map(liOf);
  const key = a => a.join(',');
  let opts;
  if (n === 1){
    opts = [correct].concat(shuffle([0,1,2,3,4,5,6].filter(x => x !== correct[0])).slice(0, 3).map(x => [x]));
  } else {
    const seen = new Set([key(correct)]); opts = [correct]; let t = 0;
    while (opts.length < 4 && t < 300){
      t++;
      const m = correct.slice();
      const changes = rint(1, n === 2 ? 2 : 3);
      shuffle([...Array(n).keys()]).slice(0, changes).forEach(pos => {
        m[pos] = (m[pos] + [1,-1,2,-2][rint(0,3)] + 7) % 7;
      });
      if (!seen.has(key(m))){ seen.add(key(m)); opts.push(m); }
    }
  }
  opts = shuffle(opts);
  return {steps, staff:pool.staff, options:opts, answer:opts.findIndex(o => key(o) === key(correct))};
}
function where(step, staff){
  if (step === 28) return 'Middle C sits on its own little line, right between the two staves.';
  const bottom = staff === 'bass' ? 18 : 30, d = step - bottom, name = staff === 'bass' ? 'bass' : 'treble';
  if (d >= 0 && d <= 8){
    return d % 2 === 0 ? `It sits on line ${d/2 + 1} of the ${name} staff, counting up from the bottom.`
                       : `It sits in space ${(d+1)/2} of the ${name} staff, counting up from the bottom.`;
  }
  if (d < 0) return d % 2 === 0 ? `It sits on a little extra line below the ${name} staff.` : `It hangs just below the ${name} staff.`;
  return (d - 8) % 2 === 0 ? `It sits on a little extra line above the ${name} staff.` : `It floats just above the ${name} staff.`;
}

/* ---------- staff drawing ---------- */
function drawStaff(el, opt){
  if (!el) return [];
  el.innerHTML = '';
  if (!VF){ el.innerHTML = '<p class="vf-err">The music notes could not load. Check the internet connection and open the page again.</p>'; return []; }
  const mode = opt.mode, grand = mode === 'grand';
  const W = 300, H = grand ? 220 : 130;
  const notes = opt.notes || [], dur = opt.dur || 'q', colors = opt.colors || {};
  try {
    const r = new VF.Renderer(el, VF.Renderer.Backends.SVG);
    r.resize(W, H);
    const ctx = r.getContext();
    ctx.setFillStyle(INK); ctx.setStrokeStyle(INK);
    const x = grand ? 24 : 6, w = W - x - 6;
    const mk = (y, clef) => {
      const st = new VF.Stave(x, y, w);
      st.addClef(clef);
      if (opt.key !== 'C') st.addKeySignature(opt.key);
      st.setStyle({fillStyle:INK, strokeStyle:INK});
      st.setContext(ctx).draw();
      return st;
    };
    let tr = null, ba = null;
    if (mode === 'bass') ba = mk(0, 'bass');
    else if (mode === 'treble') tr = mk(0, 'treble');
    else {
      tr = mk(0, 'treble'); ba = mk(90, 'bass');
      ['brace','singleLeft','singleRight'].forEach(t => {
        const c = new VF.StaveConnector(tr, ba); c.setType(t);
        if (c.setStyle) c.setStyle({fillStyle:INK, strokeStyle:INK});
        c.setContext(ctx).draw();
      });
    }
    let xs = [];
    if (notes.length){
      const clef = notes[0].staff, stave = clef === 'bass' ? ba : tr;
      const vn = notes.map((n, i) => {
        const sn = new VF.StaveNote({keys:[LET[liOf(n.step)].toLowerCase() + '/' + octOf(n.step)], duration:dur, clef, auto_stem:true});
        const c = colors[i] || INK;
        sn.setStyle({fillStyle:c, strokeStyle:c});
        return sn;
      });
      let ticks = vn.slice();
      if (opt.pad !== false && vn.length <= 2) ticks = [new VF.GhostNote({duration:dur})].concat(vn, [new VF.GhostNote({duration:dur})]);
      const voice = new VF.Voice({num_beats: ticks.length * (dur === 'w' ? 4 : 1), beat_value:4});
      voice.setMode(VF.Voice.Mode.SOFT);
      voice.addTickables(ticks);
      new VF.Formatter().joinVoices([voice]).format([voice], stave.getNoteEndX() - stave.getNoteStartX() - 14);
      voice.draw(ctx, stave);
      xs = vn.map(n => (n.getAbsoluteX() + (n.getGlyphWidth ? n.getGlyphWidth() / 2 : 6)) / W);
    }
    const svg = el.querySelector('svg');
    if (svg){
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      svg.removeAttribute('width'); svg.removeAttribute('height');
      svg.style.width = '100%'; svg.style.height = 'auto';
      svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', notes.length ? 'Music staff with ' + notes.length + (notes.length > 1 ? ' notes' : ' note') : 'Music staff');
    }
    return xs;
  } catch(e){
    el.innerHTML = '<p class="vf-err">Something went wrong drawing the notes. Tap Next to try another.</p>';
    return [];
  }
}

    const p = L.pages[LS_.page], hi = LS_.sel !== null ? LS_.sel : p.hi, colors = {};
    if (hi !== undefined && hi !== null) colors[hi] = ROSE;
    const xs = drawStaff($('staff'), {mode: p.grand ? 'grand' : L.clef, key:'C', notes:p.notes.map(s => ({step:s, staff:L.clef})), colors, dur:'w', pad: p.notes.length <= 2});
    scaleXs = xs;
    document.querySelectorAll('#labels button').forEach((b, i) => { b.style.left = ((xs[i] !== undefined ? xs[i] : 0.5) * 100) + '%'; });
  } else if (LS_.phase === 'quiz'){
    const q = LS_.q, colors = {};
    if (LS_.answered && LS_.chosen === q.answer) colors[0] = RIGHT;
    drawStaff($('staff'), {mode:L.clef, key:'C', notes:[{step:q.steps[0], staff:L.clef}], colors});
  }
}
function lessonTap(i){
  const p = LESSONS[LS_.i].pages[LS_.page];
  LS_.sel = i; audio(); playSteps([p.notes[i]], 'C'); render();
}
function lessonAnswer(i){
  if (LS_.answered) return;
  audio();
  LS_.answered = true; LS_.chosen = i;
  if (i === LS_.q.answer) LS_.right++;
  playSteps(LS_.q.steps, 'C');
  render();
}
function lessonNextQ(){
  const L = LESSONS[LS_.i];
  LS_.asked++;
  if (LS_.asked >= L.count){
    LS_.phase = 'end';
    const pass = LS_.right >= Math.ceil(L.count * 0.75);
    if (pass && !S.progress.lessons.includes(LS_.i)){ S.progress.lessons.push(LS_.i); S.progress.lessons.sort((a, b) => a - b); save(); }
    if (pass && S.settings.sound){ (L.clef === 'bass' ? [21,23,25,28] : [28,30,32,35]).forEach((s, j) => tone(freq(s, 'C'), j * 0.12, 0.9, 0.18)); }
  } else { LS_.q = lessonQ(); LS_.answered = false; LS_.chosen = null; }
  render();
}

/* ---------- piano palace ---------- */
let K = null, kraf = 0, kflash = null, kScrolled = false;
const KPRAISE = ['Lovely playing!','Royal fingers!','Sparkling!','Bravo, princess!','Perfect pitch!'];
function midiOf(step, key){ const li = liOf(step), a = KEYS[key].acc[li] || 0; return 12 * (octOf(step) + 1) + SEMI[li] + a; }
function freqM(m){ return 440 * Math.pow(2, (m - 69) / 12); }
function keyName(m){
  const pc = ((m % 12) + 12) % 12, W = {0:0, 2:1, 4:2, 5:3, 7:4, 9:5, 11:6}, N = S.settings.names === 'letter' ? LET : SOL;
  if (pc in W) return N[W[pc]];
  const lo = W[pc - 1]; return `${N[lo]}♯ / ${N[(lo + 1) % 7]}♭`;
}
function keysRange(){
  const ps = pools(); let lo = Math.min(...ps.map(p => p.lo)), hi = Math.max(...ps.map(p => p.hi));
  while (liOf(lo) !== 0 && liOf(lo) !== 3) lo--;
  while (liOf(hi) !== 6 && liOf(hi) !== 2) hi++;
  return [lo, hi];
}
function newKeysCard(){
  K.q = makeQuestion(K.n); K.idx = 0; K.done = false; K.msg = ''; K.cardWrong = 0; K.hint = false;
}
function startKeys(mode){
  const n = K ? K.n : 1;
  K = {mode, n, idx:0, wrong:0, round:0, total:10, finished:null};
  if (mode === 'race'){ K.t0 = performance.now(); }
  newKeysCard();
  render(); kTick();
}
function kTick(){
  cancelAnimationFrame(kraf);
  const step = () => {
    if (S.screen !== 'keys' || !K || K.mode !== 'race' || K.finished) return;
    const el = $('ktime'); if (el) el.textContent = ((performance.now() - K.t0) / 1000 + 2 * K.wrong).toFixed(1) + 's';
    kraf = requestAnimationFrame(step);
  };
  kraf = requestAnimationFrame(step);
}
function keysView(){
  const q = K.q, race = K.mode === 'race', [lo, hi] = keysRange(), whites = [];
  for (let st = lo; st <= hi; st++) whites.push(st);
  const N = whites.length, nameArr = S.settings.names === 'letter' ? LET : SOL;
  let piano = `<div class="piano-wrap" id="pwrap"><div class="piano" id="piano" style="--nw:${N}" role="group" aria-label="Piano keyboard">`;
  whites.forEach(st => { const li = liOf(st), m = 12 * (octOf(st) + 1) + SEMI[li];
    piano += `<button class="wk" data-act="pkey" data-arg="${m}" aria-label="${SOL[li]}, ${LET[li]}${octOf(st)}">${m === 60 ? '<i class="mc" aria-hidden="true"></i>' : ''}</button>`; });
  whites.forEach((st, i) => { const li = liOf(st);
    if ([0,1,3,4,5].includes(li) && i < N - 1){ const m = 12 * (octOf(st) + 1) + SEMI[li] + 1;
      piano += `<button class="bk" data-act="pkey" data-arg="${m}" style="left:calc(${(i + 1) * 100 / N}% - ${0.3 * 100 / N}%);width:${0.6 * 100 / N}%" aria-label="${keyName(m)}"></button>`; } });
  piano += '</div></div>';
  const chips = [1,2,4].map(n => `<button class="chip ${K.n === n ? 'on' : ''}" data-act="kn" data-arg="${n}" ${race && !K.finished ? 'disabled' : ''}>${n === 1 ? '1 note' : n + ' notes'}</button>`).join('');
  let side;
  if (race && K.finished){
    const f = K.finished;
    side = `<div class="kv-msg ok"><b>${f.newBest ? 'New best time!' : 'Race finished!'}</b>${f.time.toFixed(1)} seconds for 10 cards${f.wrong ? ` (${f.wrong} wrong ${f.wrong === 1 ? 'key' : 'keys'}, +${2 * f.wrong}s)` : ', no wrong keys!'}.${f.best && !f.newBest ? ` Best is ${f.best.toFixed(1)}s.` : ''}</div>
      <div class="kv-row"><button class="btn" data-act="kmode" data-arg="practice">Practice</button><button class="btn rose" data-act="kmode" data-arg="race">Race again</button></div>`;
  } else {
    const total = q.steps.length, best = S.progress.keysBest[K.n];
    const status = race ? `<div class="kv-row" style="justify-content:space-between;font-weight:800"><span>Card ${K.round + 1} of ${K.total}</span><span class="pill" id="ktime">0.0s</span></div>` : '';
    let msg;
    if (K.done) msg = `<div class="kv-msg ok"><b>${KPRAISE[(K.round + K.idx) % KPRAISE.length]}</b>${spoken(q.steps.map(liOf))}</div>`;
    else if (K.msg) msg = `<div class="kv-msg no">${K.msg}</div>`;
    else msg = `<div class="kv-msg"><b>${total === 1 ? 'Play this note' : `Play note ${K.idx + 1} of ${total}`}</b><span class="more">${total === 1 ? 'Find it on the piano.' : 'Left to right. The pink note is next.'}${S.settings.exact ? '' : ' Any key with the same name counts.'}</span></div>`;
    const raceB = `<button class="btn rose" data-act="kmode" data-arg="race" aria-label="Race 10 cards${best ? ', best ' + best.toFixed(1) + ' seconds' : ''}">Race${best ? ` · ${best.toFixed(1)}s` : ''}</button>`;
    const btns = race ? '' : K.done
      ? `<div class="kv-row"><button class="btn" data-act="khear">Hear it</button><button class="btn violet" data-act="knext">Next</button>${raceB}</div>`
      : `<div class="kv-row"><button class="btn" data-act="khint">Show key</button><button class="btn" data-act="knext">Skip</button>${raceB}</div>`;
    const raceBtn = '';
    const toggles = race ? '' : `<div class="kv-tog"><button class="chip ${S.settings.keyNames ? 'on' : ''}" data-act="ktog" data-arg="keyNames" aria-pressed="${S.settings.keyNames}">Names on keys</button><button class="chip ${S.settings.exact ? 'on' : ''}" data-act="ktog" data-arg="exact" aria-pressed="${S.settings.exact}">Exact octave</button></div>`;
    side = status + msg + btns + raceBtn;
  }
  return `
  <div class="kv-head"><button class="icon-btn" data-act="go" data-arg="home" aria-label="Back">${I.back}</button><h1>Piano Palace${race ? ' · Race' : ''}</h1><div class="chips">${chips}${race ? '' : `<button class="chip ${S.settings.exact ? 'on' : ''}" data-act="ktog" data-arg="exact" aria-pressed="${S.settings.exact}">Exact octave</button>`}</div></div>
  <div class="rotate-tip">${I.rotate}<span>Turn your phone sideways for a bigger piano.</span></div>
  <div class="kv-top"><div class="kv-staff"><div class="staff" id="staff"></div></div><div class="kv-side">${side}</div></div>
  ${piano}`;
}
function keysAfter(){
  const q = K.q, colors = {};
  q.steps.forEach((_, i) => { if (i < K.idx) colors[i] = RIGHT; else if (i === K.idx && q.steps.length > 1 && !K.done) colors[i] = ROSE; });
  drawStaff($('staff'), {mode:staffMode(), key:S.settings.key, notes:q.steps.map(st => ({step:st, staff:q.staff})), colors});
  if (K.hint && !K.done){ const b = document.querySelector(`[data-act=pkey][data-arg="${midiOf(q.steps[K.idx], S.settings.key)}"]`); if (b) b.classList.add('hint'); }
  if (kflash && performance.now() - kflash.at < 450){
    const b = document.querySelector(`[data-act=pkey][data-arg="${kflash.m}"]`);
    if (b){ b.classList.add(kflash.cls); const left = 450 - (performance.now() - kflash.at); setTimeout(() => b.classList.remove('hit-ok', 'hit-no', 'pressed'), left); }
  }
  const wrap = $('pwrap');
  if (wrap && !kScrolled && wrap.scrollWidth > wrap.clientWidth){
    const mc = document.querySelector('[data-act=pkey][data-arg="60"]');
    if (mc) wrap.scrollLeft = mc.offsetLeft - wrap.clientWidth / 2 + mc.offsetWidth / 2;
    kScrolled = true;
  }
}
function pkey(m){
  audio();
  if (S.settings.sound) tone(freqM(m), 0, 1.1, 0.24);
  if (!K || !K.q || K.done || (K.mode === 'race' && K.finished)){ kflash = {m, cls:'pressed', at:performance.now()}; flashNow(); return; }
  const target = midiOf(K.q.steps[K.idx], S.settings.key);
  const ok = S.settings.exact ? m === target : ((m - target) % 12 + 12) % 12 === 0;
  if (ok){
    kflash = {m, cls:'hit-ok', at:performance.now()};
    K.idx++; K.msg = ''; K.hint = false;
    if (K.idx >= K.q.steps.length){
      K.done = true;
      if (K.mode === 'race'){
        K.round++;
        if (K.round >= K.total){
          const time = (performance.now() - K.t0) / 1000 + 2 * K.wrong, old = S.progress.keysBest[K.n];
          const newBest = !old || time < old; if (newBest){ S.progress.keysBest[K.n] = Math.round(time * 10) / 10; save(); }
          K.finished = {time, wrong:K.wrong, newBest, best: old};
          if (S.settings.sound){ const base = SCALE_START[S.settings.key]; [0,2,4,7].forEach((d, j) => tone(freq(base + d, S.settings.key), 0.3 + j * 0.12, 0.9, 0.18)); }
        } else setTimeout(() => { if (S.screen === 'keys' && K && K.mode === 'race' && !K.finished){ newKeysCard(); render(); } }, 450);
      }
    }
  } else {
    kflash = {m, cls:'hit-no', at:performance.now()};
    K.wrong++; K.cardWrong++;
    const target2 = target, same = ((m - target2) % 12 + 12) % 12 === 0;
    K.msg = same ? `<b>Right name, wrong place!</b>Try the ${m > target2 ? 'lower' : 'higher'} ${keyName(target2)}. Middle C has a pink dot.`
                 : `<b>That key is ${keyName(m)}.</b>Look at ${K.q.steps.length > 1 ? 'the pink note' : 'the note'} again.`;
    if (K.mode === 'practice' && K.cardWrong >= 2) K.hint = true;
  }
  render();
}
function flashNow(){
  const b = document.querySelector(`[data-act=pkey][data-arg="${kflash.m}"]`);
  if (b){ b.classList.add(kflash.cls); setTimeout(() => b.classList.remove('pressed'), 180); }
}

/* ---------- render ---------- */
const VIEWS = {
  keys:[keysView, keysAfter, true],
  lessons:[lessonsView, null, true], lesson:[lessonView, lessonAfter, true],
  home:[homeView, homeAfter, false], practice:[practiceView, practiceAfter, true], levels:[levelsView, null, false],
  play:[playView, playAfter, false], results:[resultsView, null, false], scale:[scaleView, scaleAfter, true], settings:[settingsView, null, false]
};
function render(){
  const [view, after, lilac] = VIEWS[S.screen];
  document.body.classList.toggle('lilac', lilac);
  document.body.classList.toggle('keys', S.screen === 'keys');
  $('app').innerHTML = view();
  if (after) after();
}
function go(screen){
  if (G && G.raf) cancelAnimationFrame(G.raf);
  clearTimeout(G && G.next); clearInterval(scaleTimer); cancelAnimationFrame(kraf);
  if (screen === 'keys'){ kScrolled = false; if (!K || K.mode === 'race') { K = {mode:'practice', n: K ? K.n : 1}; newKeysCard(); } }
  if (screen === 'practice' && !P.q) P.q = makeQuestion(P.n);
  if (screen === 'scale'){ S.scaleSel = null; if (!S.scaleKey) S.scaleKey = S.settings.key; }
  S.screen = screen;
  render();
  window.scrollTo(0, 0);
}

/* ---------- practice ---------- */
function newPractice(){ P.q = makeQuestion(P.n); P.answered = false; P.chosen = null; P.hint = false; render(); }
function answerPractice(i){
  if (P.answered) return;
  audio();
  P.answered = true; P.chosen = i;
  P.streak = i === P.q.answer ? P.streak + 1 : 0;
  S.progress.practiced++; save();
  playSteps(P.q.steps);
  render();
}

/* ---------- timed ---------- */
function startLevel(i){
  if (!unlocked(i)) return;
  audio();
  if (G && G.raf) cancelAnimationFrame(G.raf);
  if (G) clearTimeout(G.next);
  G = {level:i, round:0, hearts:3, score:0, streak:0, bestStreak:0, correct:0, times:[], missed:{}};
  S.screen = 'play';
  window.scrollTo(0, 0);
  startRound();
}
function startRound(){
  const L = LEVELS[G.level];
  G.q = makeQuestion(L.n); G.answered = false; G.chosen = null;
  G.start = performance.now(); G.end = G.start + L.time * 1000;
  render();
  G.raf = requestAnimationFrame(tick);
}
function tick(){
  if (S.screen !== 'play' || G.answered) return;
  const L = LEVELS[G.level], left = Math.max(0, G.end - performance.now());
  const f = $('fill'), s = $('secs'), b = $('bar');
  if (f) f.style.width = (100 * left / (L.time * 1000)) + '%';
  if (s) s.textContent = Math.ceil(left / 1000) + 's';
  if (b) b.classList.toggle('low', left < 3000);
  if (left <= 0){ answerTimed(-1); return; }
  G.raf = requestAnimationFrame(tick);
}
function answerTimed(i){
  if (G.answered) return;
  cancelAnimationFrame(G.raf);
  G.answered = true; G.chosen = i; G.answeredAt = performance.now();
  const q = G.q, ok = i === q.answer;
  if (ok){
    G.correct++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak);
    const left = Math.max(0, G.end - G.answeredAt) / 1000;
    G.score += 100 + Math.round(left * 10) + 10 * Math.min(G.streak, 10);
    G.times.push(G.answeredAt - G.start);
  } else {
    G.hearts--; G.streak = 0;
    const chosen = i >= 0 ? q.options[i] : null;
    q.steps.forEach((s, p) => {
      const li = liOf(s);
      if (!chosen || chosen[p] !== li){ const k = spokenShort(li); G.missed[k] = (G.missed[k] || 0) + 1; }
    });
  }
  playSteps(q.steps, null, 0.3);
  render();
  G.next = setTimeout(() => {
    G.round++;
    if (G.hearts <= 0 || G.round >= LEVELS[G.level].rounds) finish();
    else startRound();
  }, ok ? 800 : 1700);
}
function spokenShort(li){ const n = names(li); return S.settings.names === 'letter' ? n.let : S.settings.names === 'both' ? n.sol + ' · ' + n.let : n.sol; }
function finish(){
  const L = LEVELS[G.level], failed = G.hearts <= 0, p = G.correct / L.rounds;
  const stars = failed ? 0 : p >= 0.93 ? 3 : p >= 0.8 ? 2 : p >= 0.6 ? 1 : 0;
  const wasUnlocked = G.level < 8 && unlocked(G.level + 1);
  S.progress.best[G.level] = Math.max(S.progress.best[G.level], stars);
  save();
  R = {level:G.level, stars, failed, correct:G.correct, times:G.times, bestStreak:G.bestStreak, score:G.score, missed:G.missed,
       unlockedNew: G.level < 8 && !wasUnlocked && unlocked(G.level + 1)};
  S.sel = R.unlockedNew ? G.level + 1 : G.level;
  S.screen = 'results';
  render();
  if (stars > 0 && S.settings.sound){ const k = S.settings.key, base = SCALE_START[k]; [0,2,4,7].forEach((d, j) => tone(freq(base + d, k), j * 0.12, 0.9, 0.18)); }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t){
    const wrap = e.target.closest('#swrap');
    if (wrap && scaleXs.length){
      const r = wrap.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width;
      let best = 0; scaleXs.forEach((x, i) => { if (Math.abs(x - fx) < Math.abs(scaleXs[best] - fx)) best = i; });
      if (S.screen === 'lesson') lessonTap(best); else scaleTap(best);
    }
    return;
  }
  const act = t.dataset.act, arg = t.dataset.arg;
  switch (act){
    case 'go': go(arg); break;
    case 'quit': go('levels'); break;
    case 'set': {
      const k = t.dataset.k, v = t.dataset.v;
      S.settings[k] = v;
      if (k === 'staff'){ const pr = PRESETS.ledger[v]; S.settings.low = clamp(S.settings.low, pr[0], pr[1] - 3); S.settings.high = clamp(S.settings.high, S.settings.low + 3, pr[1]); }
      if (k === 'key') S.scaleKey = v;
      save();
      if (S.screen === 'practice') newPractice(); else render();
      break;
    }
    case 'range': {
      const k = t.dataset.k, d = parseInt(t.dataset.v, 10), s = S.settings;
      if (k === 'low') s.low = clamp(s.low + d, 14, s.high - 3); else s.high = clamp(s.high + d, s.low + 3, 42);
      save(); render(); break;
    }
    case 'preset': { const p = PRESETS[arg][S.settings.staff]; S.settings.low = p[0]; S.settings.high = p[1]; save(); render(); break; }
    case 'sound': S.settings.sound = !S.settings.sound; save(); render(); break;
    case 'pn': P.n = parseInt(arg, 10); P.streak = 0; newPractice(); break;
    case 'hint': P.hint = true; render(); break;
    case 'pnext': newPractice(); break;
    case 'replay': audio(); playSteps(P.q.steps); break;
    case 'answer': {
      const i = parseInt(arg, 10);
      if (S.screen === 'practice') answerPractice(i); else if (S.screen === 'play') answerTimed(i); else if (S.screen === 'lesson') lessonAnswer(i);
      break;
    }
    case 'lesson': startLesson(parseInt(arg, 10)); break;
    case 'lnote': lessonTap(parseInt(arg, 10)); break;
    case 'lprev': LS_.page = Math.max(0, LS_.page - 1); LS_.sel = null; render(); break;
    case 'lnext': {
      const L = LESSONS[LS_.i];
      if (LS_.page < L.pages.length - 1){ LS_.page++; LS_.sel = null; }
      else { LS_.phase = 'quiz'; LS_.q = lessonQ(); }
      render(); window.scrollTo(0, 0); break;
    }
    case 'lqnext': lessonNextQ(); break;
    case 'bothon': S.settings.staff = 'grand'; S.settings.low = Math.min(S.settings.low, 18); save(); go('home'); break;
    case 'sel': S.sel = parseInt(arg, 10); render(); break;
    case 'start': startLevel(parseInt(arg, 10)); break;
    case 'skey': S.scaleKey = arg; S.scaleSel = null; clearInterval(scaleTimer); render(); break;
    case 'snote': audio(); scaleTap(parseInt(arg, 10)); break;
    case 'splay': playScale(); break;
    case 'pkey': break;
    case 'kn': K.n = parseInt(arg, 10); newKeysCard(); render(); break;
    case 'knext': newKeysCard(); render(); break;
    case 'khint': K.hint = true; render(); break;
    case 'khear': audio(); playSteps(K.q.steps); break;
    case 'kmode': startKeys(arg); break;
    case 'ktog': S.settings[arg] = !S.settings[arg]; save(); render(); break;
    case 'squiz': {
      S.settings.key = S.scaleKey || S.settings.key; save();
      P.n = 1; P.streak = 0; P.q = null; go('practice'); newPractice(); break;
    }
  }
});
document.addEventListener('pointerdown', e => {
  const t = e.target.closest('[data-act=pkey]'); if (!t) return;
  e.preventDefault(); pkey(parseInt(t.dataset.arg, 10));
});
document.addEventListener('input', e => {
  if (e.target.id === 'pname'){ S.settings.name = e.target.value.slice(0, 16); save(); }
});

render();
connect();
})();
</script>
</body>
